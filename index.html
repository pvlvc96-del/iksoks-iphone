
<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#101827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IKS-OKS">

    <title>IKS-OKS</title>

    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main>

        <header>
            <small>MOJA PRVA iPHONE IGRICA</small>
            <h1>IKS <em>–</em> OKS</h1>
            <p>Izaberi režim i započni partiju!</p>
        </header>

        <section class="settings">
            <div class="modes">
                <button id="two" type="button" class="active">
                    Dva igrača
                </button>

                <button id="phone" type="button">
                    Protiv telefona
                </button>
            </div>

            <div id="difficultyWrap" hidden>
                <label for="difficulty">Težina:</label>

                <select id="difficulty">
                    <option value="easy">Lako</option>
                    <option value="medium">Srednje</option>
                    <option value="hard" selected>
                        Teško — nepobediv
                    </option>
                </select>
            </div>
        </section>

        <section class="scores">
            <div>
                <small>IGRAČ X</small>
                <strong id="scoreX">0</strong>
            </div>

            <div>
                <small>NER.</small>
                <strong id="scoreD">0</strong>
            </div>

            <div>
                <small id="labelO">IGRAČ O</small>
                <strong id="scoreO">0</strong>
            </div>
        </section>

        <p id="status" role="status" aria-live="polite">
            Na potezu: X
        </p>

        <!-- TABLA 3 x 3 -->
        <section class="board" aria-label="IKS-OKS tabla">

            <button data-i="0" aria-label="Polje 1"></button>
            <button data-i="1" aria-label="Polje 2"></button>
            <button data-i="2" aria-label="Polje 3"></button>

            <button data-i="3" aria-label="Polje 4"></button>
            <button data-i="4" aria-label="Polje 5"></button>
            <button data-i="5" aria-label="Polje 6"></button>

            <button data-i="6" aria-label="Polje 7"></button>
            <button data-i="7" aria-label="Polje 8"></button>
            <button data-i="8" aria-label="Polje 9"></button>

        </section>

        <section class="actions">
            <button id="new" type="button">
                Nova partija ↻
            </button>

            <button id="reset" type="button">
                Reset rezultata
            </button>
        </section>

        <footer>
            Rezultati se čuvaju na telefonu • Offline podrška
        </footer>

    </main>

    <script src="./app.js" defer></script>
</body>
</html>
